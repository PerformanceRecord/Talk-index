<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Vtuber 雲丹ゐくらのトークリスト" />
    <title>うにとーーく</title>
    <link rel="icon" href="./assets/icons/favicon.ico" sizes="any" />
    <link rel="icon" href="./assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="icon" href="./assets/icons/icon-192.png" sizes="192x192" />
    <link rel="icon" href="./assets/icons/icon-512.png" sizes="512x512" />
    <link rel="stylesheet" href="./styles.css?v=20260823-mobile-video" />
  </head>
  <body>
    <div class="ambient-scene" aria-hidden="true">
      <div id="bubble-layer" class="ambient-layer ambient-layer--bubbles"></div>
      <div id="star-layer" class="ambient-layer ambient-layer--stars"></div>
    </div>
    <main class="page">
      <div class="ambient-header" aria-hidden="true">
        <div class="ambient-wave"></div>
      </div>

      <section class="surface talk-area" aria-label="トーク集">
        <div class="content-layout">
          <div class="left-pane">
            <div class="left-toolbar">
              <div class="view-tabs-row">
                <div class="view-tabs" role="tablist" aria-label="探し方を切り替える">
                  <button id="tab-video" class="view-tab is-active" type="button" role="tab" aria-selected="true" aria-controls="results">動画単位</button>
                  <button id="tab-talk" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="results">トーク単位</button>
                  <button id="tab-favorites" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="results">テーマ探索</button>
                </div>
                <button id="top-button" class="top-button" type="button" aria-label="動画一覧の先頭へ戻る">TOP</button>
              </div>
              <section class="surface control-menu" aria-label="操作メニュー">
                <div class="control-row top-row">
                  <div id="server-status" class="server-status server-status--loading" aria-live="polite">読込中…</div>
                  <div class="menu-buttons">
                    <button id="toggle-all" type="button" disabled>詳細を閉じる</button>
                    <button id="explore-theme" type="button">テーマを探す</button>
                  </div>
                </div>
                <div class="control-row search-row">
                  <div class="search-field">
                    <label for="search">
                      横断検索
                      <span>動画タイトル・トークテーマ・小見出し</span>
                    </label>
                    <div class="search-input-wrap">
                      <input
                        id="search"
                        type="search"
                        placeholder="動画タイトル・トークテーマを検索"
                        aria-label="動画タイトル・トークテーマを横断検索"
                        enterkeyhint="search"
                        autocomplete="off"
                      />
                      <kbd aria-hidden="true">/</kbd>
                    </div>
                  </div>
                  <button id="clear-search" type="button">クリア</button>
                </div>
              </section>
            </div>
            <div id="mode-context" class="mode-context" hidden></div>
            <div id="notice" class="notice"></div>
            <div id="error" class="error" role="alert"></div>
            <div id="search-overview" class="search-overview" aria-live="polite" hidden></div>
            <section id="results" class="results" aria-live="polite" aria-label="検索結果"></section>
          </div>
          <aside id="video-detail-panel" class="video-detail-panel" aria-label="選択した動画の詳細" hidden>
            <div class="video-player-pane">
              <div class="detail-panel-heading">
                <strong id="video-detail-title">動画を選択してください</strong>
                <button id="video-detail-close" class="detail-panel-close" type="button" aria-label="動画詳細を閉じる">閉じる</button>
              </div>
              <div class="video-player-wrap">
                <iframe
                  id="video-detail-player"
                  title="選択した動画の再生プレイヤー"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowfullscreen
                ></iframe>
              </div>
            </div>
            <div class="video-headings-pane">
              <h2>トークの大見出し</h2>
              <div id="video-detail-content" class="video-detail-content"></div>
            </div>
          </aside>
        </div>
      </section>

    </main>

    <script>
      window.TALK_INDEX_DATA_URL = "https://pub-32b1e056728a40248bbab7a27ed72828.r2.dev/index/latest.json";
      window.__TALK_INDEX_FAVORITES_BASE_URL__ = "https://talk-index-favorites.kyomtea.workers.dev";
    </script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
